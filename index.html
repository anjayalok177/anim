<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimeStream - Jikan x Sankanime (Otakudesu)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html { scroll-behavior: smooth; }
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; transform: translateY(15px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .anime-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px -10px rgba(59, 130, 246, 0.5); border-color: #3b82f6; }
        .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        .loader { border-top-color: #3b82f6; animation: spinner 0.8s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen overflow-x-hidden">

    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400 cursor-pointer" onclick="goHome()">
                NimeStream
            </h1>
            <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700 hidden md:inline-block">UI: Jikan | Engine: Otakudesu</span>
        </div>
    </nav>

    <main class="pt-24 pb-12 max-w-7xl mx-auto px-4">
        
        <div id="page-home" class="fade-in block">
            <h2 class="text-2xl font-bold mb-6 border-l-4 border-blue-500 pl-3">🔥 Trending Anime</h2>
            <div id="anime-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                <div class="flex justify-center items-center h-64 w-full col-span-full"><div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-12 w-12"></div></div>
            </div>
        </div>

        <div id="page-detail" class="fade-in hidden">
            <button onclick="goHome()" class="mb-6 flex items-center text-blue-400 hover:text-blue-300 transition-colors font-semibold bg-slate-800 px-4 py-2 rounded-lg w-max">← Kembali ke Beranda</button>
            <div id="detail-content"></div>
        </div>

        <div id="page-player" class="fade-in hidden">
            <button onclick="backToDetail()" class="mb-6 flex items-center text-blue-400 hover:text-blue-300 transition-colors font-semibold bg-slate-800 px-4 py-2 rounded-lg w-max">← Kembali ke Detail</button>
            
            <div class="max-w-5xl mx-auto bg-slate-800 rounded-2xl overflow-hidden shadow-2xl p-4 border border-slate-700">
                <h2 id="player-title" class="text-lg md:text-xl font-bold mb-4 text-center text-cyan-50">Menyiapkan Video...</h2>
                
                <div class="aspect-video bg-black relative rounded-lg overflow-hidden flex justify-center items-center shadow-inner">
                    <div id="video-loading" class="absolute flex flex-col items-center z-20 bg-slate-900/90 px-6 py-6 rounded-xl text-center w-full max-w-md">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-blue-500 h-10 w-10 mb-4 mx-auto"></div>
                        <span id="video-status" class="text-sm font-semibold text-blue-200 animate-pulse">Memulai sinkronisasi ke Otakudesu...</span>
                        <div id="video-logs" class="mt-3 text-xs text-slate-400 font-mono text-left bg-black/50 p-2 rounded w-full h-24 overflow-y-auto">> Inisialisasi Player...</div>
                    </div>
                    
                    <iframe id="iframe-element" allowfullscreen class="w-full h-full hidden z-10 bg-black" sandbox="allow-same-origin allow-scripts allow-popups"></iframe>
                </div>
            </div>
        </div>

    </main>

    <script>
        // ====================================================================
        // KONFIGURASI API
        // ====================================================================
        const API_JIKAN = 'https://api.jikan.moe/v4';
        
        // PASTIIN INI BASE URL API SANKANIME YANG AKTIF. Jangan ada garis miring (/) di akhir.
        const API_SANKANIME = 'https://api.sankavollerei.com'; // <--- Ganti sesuai URL API Vercel/Render Sankanime

        // --- Navigasi ---
        function showPage(pageId) {
            ['page-home', 'page-detail', 'page-player'].forEach(id => document.getElementById(id).classList.add('hidden'));
            const page = document.getElementById(pageId);
            page.classList.remove('hidden'); page.classList.remove('fade-in'); void page.offsetWidth; page.classList.add('fade-in');
            window.scrollTo(0, 0);
        }

        function stopVideo() {
            const iframe = document.getElementById('iframe-element');
            iframe.src = ''; // Hentikan video saat kembali
        }

        function goHome() { stopVideo(); showPage('page-home'); }
        function backToDetail() { stopVideo(); showPage('page-detail'); }

        // --- 1. HOME (JIKAN) ---
        async function loadHome() {
            const container = document.getElementById('anime-list');
            try {
                const res = await fetch(`${API_JIKAN}/top/anime?limit=15`);
                const data = await res.json();
                container.innerHTML = ''; 
                data.data.forEach(anime => {
                    container.innerHTML += `
                        <div onclick="loadDetail(${anime.mal_id})" class="anime-card bg-slate-800 border border-slate-700 rounded-xl overflow-hidden cursor-pointer">
                            <div class="relative h-56 md:h-72">
                                <img src="${anime.images.jpg.large_image_url}" loading="lazy" class="w-full h-full object-cover">
                                <div class="absolute bottom-0 w-full bg-gradient-to-t from-slate-900 via-slate-900/90 to-transparent p-3 pt-12">
                                    <h3 class="text-sm font-bold text-white truncate drop-shadow-md">${anime.title}</h3>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (error) { container.innerHTML = `<p class="col-span-full text-center text-red-400">Gagal memuat Jikan API.</p>`; }
        }

        // --- 2. DETAIL (JIKAN) ---
        async function loadDetail(id) {
            showPage('page-detail');
            const container = document.getElementById('detail-content');
            container.innerHTML = `<div class="flex justify-center py-32"><div class="loader h-12 w-12 rounded-full border-4 border-t-4 border-blue-500"></div></div>`;
            
            try {
                const res = await fetch(`${API_JIKAN}/anime/${id}/full`);
                const data = await res.json();
                const anime = data.data;

                const totalEpisodes = anime.episodes || 12; 
                let episodesHtml = '';
                for(let i = 1; i <= totalEpisodes; i++) {
                    episodesHtml += `
                        <button onclick="playVideoBridge('${anime.title.replace(/'/g, "\\'")}', ${i})" 
                                class="bg-slate-700 hover:bg-blue-600 transition-all duration-200 py-2 px-1 rounded-lg font-semibold shadow-md text-sm border border-slate-600 hover:border-blue-400">
                            Eps ${i}
                        </button>`;
                }

                container.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-8 bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                        <img src="${anime.images.jpg.large_image_url}" class="w-full md:w-64 h-auto rounded-xl shadow-lg object-cover border border-slate-600">
                        <div class="flex-1 min-w-0">
                            <h1 class="text-2xl md:text-4xl font-black mb-4 text-cyan-50">${anime.title}</h1>
                            <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-6 bg-slate-900/50 p-4 rounded-xl">${anime.synopsis}</p>
                            <h3 class="text-xl font-bold mb-4 border-l-4 border-blue-500 pl-3">Daftar Episode</h3>
                            <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-3 max-h-64 overflow-y-auto pr-2 custom-scrollbar">${episodesHtml}</div>
                        </div>
                    </div>`;
            } catch (error) { container.innerHTML = `<p class="text-red-400 text-center py-10">Gagal memuat detail.</p>`; }
        }

        // --- 3. BRIDGE JIKAN -> SANKANIME (OTAKUDESU) ---
        function updateLog(msg, isError = false) {
            const logBox = document.getElementById('video-logs');
            logBox.innerHTML += `<br>> <span style="color:${isError ? '#f87171' : '#94a3b8'}">${msg}</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function playVideoBridge(jikanTitle, episodeNumber) {
            showPage('page-player');
            const iframeEl = document.getElementById('iframe-element');
            const loadingUI = document.getElementById('video-loading');
            const statusText = document.getElementById('video-status');
            
            iframeEl.classList.add('hidden');
            iframeEl.src = '';
            loadingUI.classList.remove('hidden');
            document.getElementById('video-logs').innerHTML = '> Memulai pencarian via Vercel Proxy...';
            document.getElementById('player-title').innerText = `${jikanTitle} - Episode ${episodeNumber}`;
            
            try {
                const BASE_API = 'https://api.sankavollerei.com';
                const cleanTitle = jikanTitle.replace(/[^a-zA-Z0-9\s]/g, '').split(' ').slice(0, 2).join(' ');
                
                statusText.innerText = "Mencari data anime...";
                const rawSearchUrl = `${BASE_API}/anime/otakudesu/search?q=${encodeURIComponent(cleanTitle)}`;
                updateLog(`[1] Request: ${rawSearchUrl}`);
                
                // --- BAGIAN DETEKTOR ERROR ---
                const searchRes = await fetch(`/api/proxy?url=${encodeURIComponent(rawSearchUrl)}`);
                
                if (!searchRes.ok) {
                    // Tangkap pesan error dari Vercel
                    let errorDetail = "";
                    try {
                        const errJson = await searchRes.json();
                        errorDetail = errJson.error || "Tanpa pesan";
                    } catch(e) {
                        errorDetail = "Bukan format JSON";
                    }
                    // Lempar status HTTP aslinya (misal: 404, 403, 500)
                    throw new Error(`HTTP Status ${searchRes.status} | Detail: ${errorDetail}`);
                }
                // -----------------------------
                
                const searchData = await searchRes.json();
                const searchResults = searchData.data || searchData.result || searchData;

                if (!searchResults || !Array.isArray(searchResults) || searchResults.length === 0) {
                    throw new Error(`Data anime "${cleanTitle}" tidak ditemukan.`);
                }

                const animeUrl = searchResults[0].url;
                updateLog(`[1] Berhasil. URL: ${animeUrl.substring(0, 25)}...`);

                // TAHAP 2: DAFTAR EPISODE
                statusText.innerText = `Mengambil data episode ${episodeNumber}...`;
                const rawDetailUrl = `${BASE_API}/anime/otakudesu/detail?url=${encodeURIComponent(animeUrl)}`;
                updateLog(`[2] Request detail anime...`);
                
                const detailRes = await fetch(`/api/proxy?url=${encodeURIComponent(rawDetailUrl)}`);
                if (!detailRes.ok) throw new Error(`HTTP Status ${detailRes.status} saat ambil detail.`);
                
                const detailData = await detailRes.json();
                const animeDetail = detailData.data || detailData.result || detailData;
                
                const episodeList = animeDetail.episode_list || animeDetail.episodes || [];
                
                const targetEps = episodeList.find(eps => {
                    const title = (eps.title || eps.episode || "").toLowerCase();
                    const match = title.match(/\b0*(\d+)\b/);
                    return match && parseInt(match[1]) === parseInt(episodeNumber);
                });

                if (!targetEps) throw new Error(`Episode ${episodeNumber} tidak ditemukan dalam daftar.`);
                const epsUrl = targetEps.url;
                updateLog(`[2] Berhasil. URL episode ditemukan.`);

                // TAHAP 3: LINK STREAMING
                statusText.innerText = "Menyiapkan pemutar video...";
                const rawStreamUrl = `${BASE_API}/anime/otakudesu/episode?url=${encodeURIComponent(epsUrl)}`;
                updateLog(`[3] Request link streaming...`);
                
                const streamRes = await fetch(`/api/proxy?url=${encodeURIComponent(rawStreamUrl)}`);
                if (!streamRes.ok) throw new Error(`HTTP Status ${streamRes.status} saat ambil video.`);
                
                const streamData = await streamRes.json();
                const streamObj = streamData.data || streamData.result || streamData;

                let embedUrl = streamObj.iframe_url || streamObj.embed || 
                               (streamObj.servers && streamObj.servers.length > 0 ? (streamObj.servers[0].url || streamObj.servers[0].iframe) : null) || 
                               streamObj.url || streamObj.link;

                if (!embedUrl) throw new Error("Tidak ada link video yang dikembalikan oleh server.");
                updateLog(`[3] Selesai. Merender Iframe.`);

                // TAHAP 4: TAMPILKAN
                setTimeout(() => {
                    loadingUI.classList.add('hidden');
                    iframeEl.classList.remove('hidden');
                    iframeEl.src = embedUrl; 
                }, 500);

            } catch (error) {
                console.error(error);
                document.querySelector('.loader').classList.add('hidden');
                statusText.innerText = "❌ Terjadi Kesalahan";
                statusText.classList.replace("text-blue-200", "text-red-400");
                updateLog(`ERROR: ${error.message}`, true);
            }
        }

        window.onload = loadHome;
    </script>
</body>
</html>
