<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimeStream - Modern Anime Streaming</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        html { scroll-behavior: smooth; }
        
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .anime-card { transition: all 0.3s ease-in-out; }
        .anime-card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.5);
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }
        
        .loader {
            border-top-color: #a855f7;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen overflow-x-hidden">

    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 cursor-pointer" onclick="goHome()">
                NimeStream
            </h1>
            <div class="hidden md:flex space-x-6 text-sm font-semibold">
                <a href="#" onclick="goHome()" class="hover:text-purple-400 transition-colors">Home</a>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 max-w-7xl mx-auto px-4">
        
        <div id="page-home" class="fade-in block">
            <h2 class="text-2xl font-bold mb-6 border-l-4 border-purple-500 pl-3">🔥 Trending Anime</h2>
            <div id="trending-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                <div class="flex justify-center items-center h-48 w-full col-span-full">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-12 w-12"></div>
                </div>
            </div>
        </div>

        <div id="page-detail" class="fade-in hidden">
            <button onclick="goHome()" class="mb-6 flex items-center text-purple-400 hover:text-purple-300 transition-colors font-semibold">
                ← Kembali
            </button>
            <div id="detail-content"></div>
        </div>

        <div id="page-player" class="fade-in hidden">
            <button onclick="backToDetail()" class="mb-6 flex items-center text-purple-400 hover:text-purple-300 transition-colors font-semibold">
                ← Kembali ke Detail
            </button>
            
            <div class="max-w-4xl mx-auto bg-slate-800 rounded-2xl overflow-hidden shadow-2xl p-4">
                <h2 id="player-title" class="text-xl font-bold mb-4 text-center">Memuat Video...</h2>
                
                <div class="aspect-video bg-black relative rounded-lg overflow-hidden flex justify-center items-center">
                    <div id="video-loading" class="absolute flex flex-col items-center z-20 bg-black/70 px-6 py-4 rounded-xl">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-purple-500 h-10 w-10 mb-3"></div>
                        <span id="video-status" class="text-sm font-semibold text-purple-200">Menghubungkan ke Server...</span>
                    </div>
                    
                    <video id="video-element" controls class="w-full h-full hidden z-10"></video>
                    
                    <div id="iframe-container" class="w-full h-full hidden z-10"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const API_JIKAN = 'https://api.jikan.moe/v4';
        const API_AMVSTR = 'https://api.amvstr.me/api/v2';
        const API_DEX = 'https://api.anime-dex.workers.dev'; 
        
        let hlsPlayer = null;

        function showPage(pageId) {
            ['page-home', 'page-detail', 'page-player'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            const page = document.getElementById(pageId);
            page.classList.remove('hidden');
            
            page.classList.remove('fade-in');
            void page.offsetWidth; 
            page.classList.add('fade-in');
            window.scrollTo(0, 0);
        }

        function stopVideo() {
            if(hlsPlayer) { hlsPlayer.destroy(); }
            const videoEl = document.getElementById('video-element');
            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
            document.getElementById('iframe-container').innerHTML = '';
        }

        function goHome() {
            stopVideo();
            showPage('page-home');
        }

        function backToDetail() {
            stopVideo();
            showPage('page-detail');
        }

        async function loadHome() {
            try {
                const res = await fetch(`${API_JIKAN}/top/anime?limit=15`);
                const data = await res.json();
                
                const container = document.getElementById('trending-list');
                container.innerHTML = ''; 
                
                data.data.forEach(anime => {
                    container.innerHTML += `
                        <div onclick="loadDetail(${anime.mal_id})" class="anime-card bg-slate-800 rounded-xl overflow-hidden cursor-pointer shadow-lg">
                            <div class="relative h-60 md:h-72">
                                <img src="${anime.images.jpg.large_image_url}" loading="lazy" class="w-full h-full object-cover">
                                <div class="absolute bottom-0 w-full bg-gradient-to-t from-black/95 to-transparent p-3 pt-12">
                                    <span class="bg-purple-600 text-white text-xs font-bold px-2 py-1 rounded-full mb-2 inline-block">⭐ ${anime.score || 'N/A'}</span>
                                    <h3 class="text-sm font-bold text-white truncate">${anime.title}</h3>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Gagal memuat data:", error);
            }
        }

        async function loadDetail(id) {
            showPage('page-detail');
            const container = document.getElementById('detail-content');
            container.innerHTML = `<div class="flex justify-center py-20"><div class="loader h-12 w-12 rounded-full border-4 border-t-4 border-purple-500"></div></div>`;
            
            try {
                const res = await fetch(`${API_JIKAN}/anime/${id}/full`);
                const data = await res.json();
                const anime = data.data;

                const totalEpisodes = anime.episodes || 24;
                let episodesHtml = '';
                for(let i = 1; i <= totalEpisodes; i++) {
                    episodesHtml += `
                        <button onclick="playVideo('${anime.title.replace(/'/g, "\\'")}', ${i})" 
                                class="bg-slate-700 hover:bg-purple-600 hover:-translate-y-1 transition-all duration-200 py-2 rounded-lg font-semibold shadow-md text-sm md:text-base border border-slate-600 hover:border-purple-400">
                            Eps ${i}
                        </button>`;
                }

                container.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-8 bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                        <img src="${anime.images.jpg.large_image_url}" class="w-full md:w-72 rounded-xl shadow-lg object-cover">
                        <div class="flex-1">
                            <h1 class="text-3xl md:text-5xl font-black mb-3">${anime.title}</h1>
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${anime.genres.map(g => `<span class="bg-slate-700 border border-slate-600 text-xs px-3 py-1 rounded-full font-medium">${g.name}</span>`).join('')}
                            </div>
                            <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-6 opacity-90">${anime.synopsis}</p>
                            
                            <h3 class="text-xl font-bold mb-4 border-l-4 border-purple-500 pl-3">Daftar Episode</h3>
                            <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-3 max-h-64 overflow-y-auto pr-2 pb-2">
                                ${episodesHtml}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<p class="text-red-400 text-center py-10 font-bold">Gagal memuat detail anime.</p>`;
            }
        }

        async function playVideo(title, episode) {
            showPage('page-player');
            const videoEl = document.getElementById('video-element');
            const iframeContainer = document.getElementById('iframe-container');
            const loadingUI = document.getElementById('video-loading');
            const statusText = document.getElementById('video-status');
            
            // Reset player UI
            videoEl.classList.add('hidden');
            iframeContainer.classList.add('hidden');
            iframeContainer.innerHTML = '';
            loadingUI.classList.remove('hidden');
            
            document.getElementById('player-title').innerText = `${title} - Episode ${episode}`;
            
            // Membersihkan teks judul agar hasil pencarian API lebih akurat (misal: "Gintama°" jadi "Gintama")
            const cleanQuery = encodeURIComponent(title.replace(/[^a-zA-Z0-9\s]/g, '').split(' ').slice(0, 2).join(' '));
            
            try {
                // TAHAP 1: Mencoba HLS Premium API (AMVSTR)
                statusText.innerText = "Mencari server utama...";
                const searchRes = await fetch(`${API_AMVSTR}/search?q=${cleanQuery}`);
                if(!searchRes.ok) throw new Error("API Utama Timeout");
                
                const searchData = await searchRes.json();
                if (!searchData.results || searchData.results.length === 0) throw new Error("Tidak ditemukan.");
                
                const streamId = searchData.results[0].id;

                statusText.innerText = "Menyiapkan video...";
                const epRes = await fetch(`${API_AMVSTR}/stream/${streamId}-episode-${episode}`);
                if(!epRes.ok) throw new Error("Gagal mengekstrak M3U8");
                
                const epData = await epRes.json();
                const streamUrl = epData?.stream?.multi?.main?.url || epData?.stream?.multi?.backup?.url;
                
                if (!streamUrl) throw new Error("Link stream tidak tersedia.");

                loadingUI.classList.add('hidden');
                videoEl.classList.remove('hidden');
                
                if (Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(streamUrl);
                    hlsPlayer.attachMedia(videoEl);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play());
                } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                    videoEl.src = streamUrl;
                    videoEl.play();
                }

            } catch (error) {
                console.warn("HLS Gagal, mengaktifkan Fallback Mode Embed:", error);
                
                // TAHAP 2: FALLBACK otomatis ke Embed Iframe jika Tahap 1 gagal/CORS
                statusText.innerText = "Mengalihkan ke server stabil (Fallback)...";
                
                try {
                    const backupSearch = await fetch(`${API_DEX}/search/${cleanQuery}`).then(r => r.json());
                    if (!backupSearch.results || backupSearch.results.length === 0) throw new Error("Data cadangan kosong");
                    
                    const backupId = backupSearch.results[0].id;
                    
                    loadingUI.classList.add('hidden');
                    iframeContainer.classList.remove('hidden');
                    
                    // Memuat iframe player anti-gagal
                    iframeContainer.innerHTML = `<iframe src="https://anime-dex.workers.dev/embed/${backupId}-episode-${episode}" class="w-full h-full border-0" allowfullscreen></iframe>`;
                    
                } catch (fallbackError) {
                    loadingUI.classList.remove('hidden');
                    statusText.innerText = "Maaf, seluruh server sedang down/episode belum rilis.";
                    statusText.classList.replace("text-purple-200", "text-red-400");
                }
            }
        }

        loadHome();
    </script>
</body>
</html>
