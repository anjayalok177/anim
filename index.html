<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimeStream ID - Sankanime Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        html { scroll-behavior: smooth; }
        
        /* Animasi Transisi Halaman */
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efek Hover Card Anime */
        .anime-card { transition: all 0.3s ease; }
        .anime-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px -10px rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
        }

        /* Glassmorphism Navbar */
        .glass-nav {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #2563eb; }
        
        /* Loading Spinner */
        .loader {
            border-top-color: #3b82f6;
            animation: spinner 0.8s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen overflow-x-hidden">

    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400 cursor-pointer" onclick="goHome()">
                NimeStream ID
            </h1>
            <div class="relative w-1/2 max-w-xs md:max-w-md hidden md:block">
                <input type="text" id="search-input" placeholder="Cari anime sub indo..." 
                       class="w-full bg-slate-800 border border-slate-700 text-sm rounded-full px-4 py-2 focus:outline-none focus:border-blue-500 transition-colors"
                       onkeypress="handleSearch(event)">
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 max-w-7xl mx-auto px-4">
        
        <div id="page-home" class="fade-in block">
            <h2 class="text-2xl font-bold mb-6 border-l-4 border-blue-500 pl-3">🆕 Update Terbaru</h2>
            <div id="anime-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                <div class="flex justify-center items-center h-64 w-full col-span-full">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-12 w-12"></div>
                </div>
            </div>
        </div>

        <div id="page-detail" class="fade-in hidden">
            <button onclick="goHome()" class="mb-6 flex items-center text-blue-400 hover:text-blue-300 transition-colors font-semibold bg-slate-800 px-4 py-2 rounded-lg w-max">
                ← Kembali ke Beranda
            </button>
            <div id="detail-content"></div>
        </div>

        <div id="page-player" class="fade-in hidden">
            <button onclick="backToDetail()" class="mb-6 flex items-center text-blue-400 hover:text-blue-300 transition-colors font-semibold bg-slate-800 px-4 py-2 rounded-lg w-max">
                ← Kembali ke List Episode
            </button>
            
            <div class="max-w-5xl mx-auto bg-slate-800 rounded-2xl overflow-hidden shadow-2xl p-4 border border-slate-700">
                <h2 id="player-title" class="text-lg md:text-xl font-bold mb-4 text-center text-cyan-50">Memuat Video...</h2>
                
                <div class="aspect-video bg-black relative rounded-lg overflow-hidden flex justify-center items-center shadow-inner">
                    <div id="video-loading" class="absolute flex flex-col items-center z-20 bg-slate-900/80 px-6 py-4 rounded-xl">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-blue-500 h-10 w-10 mb-3"></div>
                        <span id="video-status" class="text-sm font-semibold text-blue-200 animate-pulse">Menghubungkan ke Server Sankanime...</span>
                    </div>
                    
                    <video id="video-element" controls class="w-full h-full hidden z-10 bg-black"></video>
                </div>
                
                <div class="mt-4 p-3 bg-blue-900/30 border border-blue-800/50 rounded-lg text-sm text-blue-200">
                    <p>💡 <b>Tips:</b> Jika video tidak berputar, pastikan koneksi internet stabil atau coba muat ulang halaman. Server API gratis mungkin membutuhkan waktu (TTFB) beberapa detik untuk merespons.</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        // ====================================================================
        // KONFIGURASI API SANKANIME 
        // Wajib diganti dengan base URL terbaru dari SankaVollereii
        // ====================================================================
        const API_BASE_URL = 'https://api-sankanime.vercel.app'; // <--- GANTI URL INI JIKA MATI/BERUBAH
        
        // Asumsi Struktur Endpoint Sankanime / Scraper Indo:
        // 1. Home: /api/home atau /api/ongoing
        // 2. Detail: /api/anime/{endpoint}
        // 3. Stream: /api/episode/{endpoint}
        // Jika endpoint mereka sedikit berbeda, ubah path di dalam fungsi fetch() di bawah.

        let hlsPlayer = null;
        let currentDetailId = null;

        // --- Sistem Navigasi Halaman ---
        function showPage(pageId) {
            ['page-home', 'page-detail', 'page-player'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            
            const page = document.getElementById(pageId);
            page.classList.remove('hidden');
            
            // Trigger ulang animasi
            page.classList.remove('fade-in');
            void page.offsetWidth; 
            page.classList.add('fade-in');
            window.scrollTo(0, 0);
        }

        function stopVideo() {
            if(hlsPlayer) { 
                hlsPlayer.destroy(); 
                hlsPlayer = null;
            }
            const videoEl = document.getElementById('video-element');
            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
        }

        function goHome() {
            stopVideo();
            showPage('page-home');
        }

        function backToDetail() {
            stopVideo();
            showPage('page-detail');
        }

        // --- Mengambil Data Home (Daftar Anime Terbaru) ---
        async function loadHome() {
            const container = document.getElementById('anime-list');
            try {
                // Sesuaikan '/home' dengan endpoint asli sankanime
                const res = await fetch(`${API_BASE_URL}/home`);
                const data = await res.json();
                
                container.innerHTML = ''; 
                
                // Asumsi data berformat array pada data.data atau data.result
                const animeArray = data.data || data.result || data; 
                
                animeArray.forEach(anime => {
                    // Property name bisa berbeda (misal: thumb, thumbnail, image, poster)
                    const title = anime.title || anime.judul;
                    const image = anime.thumb || anime.thumbnail || anime.poster || 'https://via.placeholder.com/225x318?text=No+Image';
                    const endpoint = anime.endpoint || anime.id;
                    const eps = anime.episode || anime.episodes || '?';

                    container.innerHTML += `
                        <div onclick="loadDetail('${endpoint}')" class="anime-card bg-slate-800 border border-slate-700 rounded-xl overflow-hidden cursor-pointer">
                            <div class="relative h-56 md:h-72">
                                <img src="${image}" loading="lazy" class="w-full h-full object-cover">
                                <div class="absolute bottom-0 w-full bg-gradient-to-t from-slate-900 via-slate-900/80 to-transparent p-3 pt-12">
                                    <span class="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded-md mb-2 inline-block">Eps ${eps}</span>
                                    <h3 class="text-sm font-bold text-white truncate drop-shadow-md">${title}</h3>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error fetching home:", error);
                container.innerHTML = `<div class="col-span-full text-center py-10"><p class="text-red-400 font-bold mb-2">Gagal terhubung ke API Sankanime.</p><p class="text-sm text-slate-400">Pastikan URL API_BASE_URL di source code sudah benar dan server tidak down.</p></div>`;
            }
        }

        // --- Mengambil Data Detail & Daftar Episode ---
        async function loadDetail(endpoint) {
            currentDetailId = endpoint;
            showPage('page-detail');
            const container = document.getElementById('detail-content');
            container.innerHTML = `<div class="flex justify-center py-32"><div class="loader h-12 w-12 rounded-full border-4 border-t-4 border-blue-500"></div></div>`;
            
            try {
                // Sesuaikan path endpoint detail
                const res = await fetch(`${API_BASE_URL}/anime/${endpoint}`);
                const resData = await res.json();
                const anime = resData.data || resData.result || resData;

                const title = anime.title || anime.judul || "Detail Anime";
                const image = anime.thumb || anime.thumbnail || anime.poster;
                const synopsis = anime.synopsis || anime.sinopsis || "Tidak ada sinopsis tersedia.";
                const genres = anime.genre || anime.genres || [];
                
                // Men-generate list episode
                const episodeList = anime.episode_list || anime.episodes || [];
                let episodesHtml = '';
                
                if(episodeList.length === 0) {
                    episodesHtml = '<p class="text-slate-400 italic">Belum ada episode yang dirilis.</p>';
                } else {
                    episodeList.forEach(eps => {
                        const epsTitle = eps.title || eps.episode || "Episode";
                        const epsEndpoint = eps.endpoint || eps.id;
                        
                        episodesHtml += `
                            <button onclick="playVideo('${epsEndpoint}', '${title.replace(/'/g, "\\'")}')" 
                                    class="bg-slate-700 hover:bg-blue-600 transition-all duration-200 py-2.5 px-2 rounded-lg font-semibold shadow-md text-sm border border-slate-600 hover:border-blue-400 truncate">
                                ${epsTitle}
                            </button>`;
                    });
                }

                // Render UI
                container.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-8 bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
                        <div class="shrink-0">
                            <img src="${image}" class="w-full md:w-64 h-auto rounded-xl shadow-lg object-cover border border-slate-600">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h1 class="text-2xl md:text-4xl font-black mb-4 text-cyan-50">${title}</h1>
                            
                            <div class="flex flex-wrap gap-2 mb-6">
                                ${Array.isArray(genres) ? genres.map(g => `<span class="bg-blue-900/50 text-blue-200 border border-blue-700/50 text-xs px-3 py-1 rounded-full">${g}</span>`).join('') : '<span class="text-xs text-slate-400">Genre tidak diketahui</span>'}
                            </div>
                            
                            <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-8 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">${synopsis}</p>
                            
                            <h3 class="text-xl font-bold mb-4 border-l-4 border-blue-500 pl-3">Daftar Episode</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 max-h-80 overflow-y-auto pr-2 pb-2 custom-scrollbar">
                                ${episodesHtml}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<p class="text-red-400 text-center py-10 font-bold bg-slate-800 rounded-xl">Gagal memuat detail anime. Terjadi kesalahan pada API Sankanime.</p>`;
            }
        }

        // --- Memuat Streaming Video ---
        async function playVideo(episodeEndpoint, animeTitle) {
            showPage('page-player');
            const videoEl = document.getElementById('video-element');
            const loadingUI = document.getElementById('video-loading');
            const statusText = document.getElementById('video-status');
            
            videoEl.classList.add('hidden');
            loadingUI.classList.remove('hidden');
            statusText.innerText = "Mengekstrak tautan video dari Sankanime...";
            
            document.getElementById('player-title').innerText = `${animeTitle}`;
            
            try {
                // Mengekstrak data stream dari endpoint episode
                const res = await fetch(`${API_BASE_URL}/episode/${episodeEndpoint}`);
                const data = await res.json();
                const streamData = data.data || data.result || data;

                // Mencari URL video m3u8 / mp4
                // API Sankanime biasanya mengembalikan objek stream_url atau link_m3u8
                const streamUrl = streamData.stream_url || streamData.link_stream || streamData.url || streamData.m3u8;

                if (!streamUrl) throw new Error("Link stream kosong atau diblokir oleh server (CORS).");

                loadingUI.classList.add('hidden');
                videoEl.classList.remove('hidden');
                
                // Inisialisasi HLS.js jika formatnya m3u8
                if (streamUrl.includes('.m3u8') && Hls.isSupported()) {
                    hlsPlayer = new Hls({
                        capLevelToPlayerSize: true,
                        maxMaxBufferLength: 30
                    });
                    hlsPlayer.loadSource(streamUrl);
                    hlsPlayer.attachMedia(videoEl);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoEl.play().catch(e => console.log("Auto-play diblokir browser."));
                    });
                    
                    // Error Handling HLS
                    hlsPlayer.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.error("Network error, mencoba memuat ulang...");
                                    hlsPlayer.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.error("Media error, mencoba memulihkan...");
                                    hlsPlayer.recoverMediaError();
                                    break;
                                default:
                                    hlsPlayer.destroy();
                                    break;
                            }
                        }
                    });
                } 
                // Fallback untuk Native MP4 atau Native HLS (Safari/iOS)
                else if (videoEl.canPlayType('application/vnd.apple.mpegurl') || streamUrl.includes('.mp4')) {
                    videoEl.src = streamUrl;
                    videoEl.play().catch(e => console.log("Auto-play diblokir."));
                } else {
                    throw new Error("Format video tidak didukung oleh browser ini.");
                }

            } catch (error) {
                console.error("Gagal memuat video:", error);
                loadingUI.classList.remove('hidden');
                document.querySelector('.loader').classList.add('hidden'); // Sembunyikan spinner
                statusText.innerText = "❌ Gagal memuat video. " + error.message;
                statusText.classList.replace("text-blue-200", "text-red-400");
            }
        }

        // Jalankan fetch awal saat website dibuka
        window.onload = loadHome;
    </script>
</body>
</html>
