<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimeStream - Modern Anime Streaming</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* Animasi Transisi Halus (Smooth Motion) */
        html { scroll-behavior: smooth; }
        
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hover Effect pada Kartu Anime */
        .anime-card {
            transition: all 0.3s ease-in-out;
        }
        .anime-card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.5); /* Glow Ungu */
        }

        /* Glassmorphism untuk Navbar */
        .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }
        
        /* Spinner Loading */
        .loader {
            border-top-color: #a855f7;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen overflow-x-hidden">

    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 cursor-pointer" onclick="goHome()">
                NimeStream
            </h1>
            <div class="hidden md:flex space-x-6 text-sm font-semibold">
                <a href="#" onclick="goHome()" class="hover:text-purple-400 transition-colors">Home</a>
                <a href="#" class="hover:text-purple-400 transition-colors">Trending</a>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 max-w-7xl mx-auto px-4">
        
        <div id="page-home" class="fade-in block">
            <h2 class="text-2xl font-bold mb-6 border-l-4 border-purple-500 pl-3">🔥 Trending Anime</h2>
            <div id="trending-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                <div class="flex justify-center items-center h-48 w-full col-span-full">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-12 w-12"></div>
                </div>
            </div>
        </div>

        <div id="page-detail" class="fade-in hidden">
            <button onclick="goHome()" class="mb-6 flex items-center text-purple-400 hover:text-purple-300 transition-colors">
                ← Kembali
            </button>
            <div id="detail-content"></div>
        </div>

        <div id="page-player" class="fade-in hidden">
            <button onclick="backToDetail()" class="mb-6 flex items-center text-purple-400 hover:text-purple-300 transition-colors">
                ← Kembali ke Detail
            </button>
            
            <div class="max-w-4xl mx-auto bg-slate-800 rounded-2xl overflow-hidden shadow-2xl p-4">
                <h2 id="player-title" class="text-xl font-bold mb-4 text-center">Memuat Video...</h2>
                
                <div class="aspect-video bg-black relative rounded-lg overflow-hidden flex justify-center items-center">
                    <div id="video-loading" class="absolute flex flex-col items-center">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-10 w-10 mb-3"></div>
                        <span id="video-status" class="text-sm text-gray-400">Menghubungkan ke Server...</span>
                    </div>
                    <video id="video-element" controls class="w-full h-full hidden z-10"></video>
                </div>
            </div>
        </div>

    </main>

    <script>
        // API Endpoints
        const API_JIKAN = 'https://api.jikan.moe/v4';
        const API_STREAM = 'https://api-consumet.vercel.app/anime/gogoanime'; // Public Consumet API API
        
        let currentAnimeDetail = null;
        let hlsPlayer = null;

        // 1. Fungsi Navigasi Halaman
        function showPage(pageId) {
            ['page-home', 'page-detail', 'page-player'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            const page = document.getElementById(pageId);
            page.classList.remove('hidden');
            
            // Trigger ulang animasi fade-in
            page.classList.remove('fade-in');
            void page.offsetWidth; 
            page.classList.add('fade-in');
            window.scrollTo(0, 0);
        }

        function goHome() {
            if(hlsPlayer) { hlsPlayer.destroy(); } // Matikan video jika kembali
            document.getElementById('video-element').pause();
            showPage('page-home');
        }

        function backToDetail() {
            if(hlsPlayer) { hlsPlayer.destroy(); }
            document.getElementById('video-element').pause();
            showPage('page-detail');
        }

        // 2. Load Halaman Utama (Trending)
        async function loadHome() {
            try {
                const res = await fetch(`${API_JIKAN}/top/anime?limit=10`);
                const data = await res.json();
                
                const container = document.getElementById('trending-list');
                container.innerHTML = ''; // Bersihkan skeleton loading
                
                data.data.forEach(anime => {
                    container.innerHTML += `
                        <div onclick="loadDetail(${anime.mal_id})" class="anime-card bg-slate-800 rounded-xl overflow-hidden cursor-pointer shadow-lg">
                            <div class="relative h-60 md:h-72">
                                <img src="${anime.images.jpg.large_image_url}" loading="lazy" class="w-full h-full object-cover">
                                <div class="absolute bottom-0 w-full bg-gradient-to-t from-black/90 to-transparent p-3 pt-10">
                                    <span class="bg-purple-600 text-white text-xs font-bold px-2 py-1 rounded-full mb-2 inline-block">⭐ ${anime.score || 'N/A'}</span>
                                    <h3 class="text-sm font-bold text-white truncate">${anime.title}</h3>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Gagal memuat data:", error);
            }
        }

        // 3. Load Detail Anime
        async function loadDetail(id) {
            showPage('page-detail');
            const container = document.getElementById('detail-content');
            container.innerHTML = `<div class="flex justify-center"><div class="loader h-12 w-12 rounded-full border-4 border-t-4 border-gray-700"></div></div>`;
            
            try {
                const res = await fetch(`${API_JIKAN}/anime/${id}/full`);
                const data = await res.json();
                const anime = data.data;
                currentAnimeDetail = anime; // Simpan data sementara

                // Asumsi jumlah episode (jika status on-going kadang bernilai null)
                const totalEpisodes = anime.episodes || 12;

                let episodesHtml = '';
                for(let i = 1; i <= totalEpisodes; i++) {
                    episodesHtml += `
                        <button onclick="playVideo('${anime.title.replace(/'/g, "\\'")}', ${i})" 
                                class="bg-slate-700 hover:bg-purple-600 hover:-translate-y-1 transition-all duration-200 py-3 rounded-lg font-semibold shadow-md">
                            Eps ${i}
                        </button>`;
                }

                container.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-8 bg-slate-800 p-6 rounded-2xl shadow-xl">
                        <img src="${anime.images.jpg.large_image_url}" class="w-full md:w-72 rounded-xl shadow-lg object-cover">
                        <div class="flex-1">
                            <h1 class="text-3xl md:text-5xl font-black mb-3">${anime.title}</h1>
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${anime.genres.map(g => `<span class="bg-slate-700 text-xs px-3 py-1 rounded-full">${g.name}</span>`).join('')}
                            </div>
                            <p class="text-slate-400 text-sm md:text-base leading-relaxed mb-6">${anime.synopsis}</p>
                            
                            <h3 class="text-xl font-bold mb-4 border-l-4 border-purple-500 pl-3">Pilih Episode</h3>
                            <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-3">
                                ${episodesHtml}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<p class="text-red-500">Gagal memuat detail.</p>`;
            }
        }

        // 4. API Video (Pencarian -> Ambil Link Stream -> Putar)
        async function playVideo(title, episode) {
            showPage('page-player');
            const videoEl = document.getElementById('video-element');
            const loadingUI = document.getElementById('video-loading');
            const statusText = document.getElementById('video-status');
            
            videoEl.classList.add('hidden');
            loadingUI.classList.remove('hidden');
            document.getElementById('player-title').innerText = `${title} - Episode ${episode}`;
            
            try {
                // Tahap 1: Cari ID anime di database streaming (Consumet)
                // Kita gunakan kata pertama dari judul untuk pencarian terbaik
                statusText.innerText = "Mencari data streaming...";
                const cleanQuery = encodeURIComponent(title.split(' ')[0].split(':')[0]); 
                const searchRes = await fetch(`${API_STREAM}/${cleanQuery}`);
                const searchData = await searchRes.json();

                if (!searchData.results || searchData.results.length === 0) throw new Error("Video tidak ditemukan di database streaming.");
                
                const streamId = searchData.results[0].id; // Dapat ID (misal: naruto-shippuden)

                // Tahap 2: Ambil Link Video (.m3u8)
                statusText.innerText = "Menarik link video...";
                const epRes = await fetch(`${API_STREAM}/watch/${streamId}-episode-${episode}`);
                const epData = await epRes.json();

                if (!epData.sources || epData.sources.length === 0) throw new Error("Link stream sedang down.");

                // Ambil kualitas default atau tertinggi
                const source = epData.sources.find(s => s.quality === 'default' || s.quality === 'auto') || epData.sources[0];
                
                // Tahap 3: Putar Video menggunakan HLS.js
                loadingUI.classList.add('hidden');
                videoEl.classList.remove('hidden');
                
                if (Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(source.url);
                    hlsPlayer.attachMedia(videoEl);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                        videoEl.play();
                    });
                } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
                    // Fallback untuk Safari (iOS/Mac mendukung native HLS)
                    videoEl.src = source.url;
                    videoEl.play();
                }

            } catch (error) {
                statusText.innerText = `Gagal memuat video: ${error.message}`;
                statusText.classList.add("text-red-500");
                console.error(error);
            }
        }

        // Inisialisasi saat web dibuka
        loadHome();
    </script>
</body>
</html>
